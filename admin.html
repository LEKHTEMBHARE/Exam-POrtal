<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="admin-page">
    <header class="topbar">
      <div class="brand-mini">Admin Panel</div>
      <div class="topbar-actions">
        <span class="user-pill">Admin</span>
        <button class="secondary-btn" data-logout>Logout</button>
      </div>
    </header>

    <main class="admin-shell">
      <nav class="admin-nav">
        <button type="button" class="admin-tab active" data-section="dashboard">Dashboard</button>
        <button type="button" class="admin-tab" data-section="students">Students / Results</button>
        <button type="button" class="admin-tab" data-section="feedback">Feedback</button>
        <button type="button" class="admin-tab" data-section="questions">Question Bank</button>
      </nav>

      <section id="dashboardSection" class="admin-section active-section">
        <div class="admin-summary">
          <div class="summary-card"><span>Total Students</span><strong id="totalStudents">0</strong></div>
          <div class="summary-card"><span>Tests Completed</span><strong id="testsCompleted">0</strong></div>
          <div class="summary-card"><span>Average Score</span><strong id="averageScore">0</strong></div>
          <div class="summary-card"><span>Highest Score</span><strong id="highestScore">0</strong></div>
          <div class="summary-card"><span>Average Percentage</span><strong id="averagePercentage">0%</strong></div>
        </div>
      </section>

      <section id="studentsSection" class="admin-section hidden-section">
        <h2>Student Results</h2>
        <div id="studentResults" class="student-results-grid"></div>
      </section>

      <section id="feedbackSection" class="admin-section hidden-section">
        <h2>Feedback Overview</h2>
        <div id="feedbackOverview" class="feedback-grid"></div>
      </section>

      <section id="questionsSection" class="admin-section hidden-section">
        <h2>Question Bank Review</h2>
        <div id="questionReviewList" class="question-review-list"></div>
      </section>
    </main>

    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
  </body>
</html>
